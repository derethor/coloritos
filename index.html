<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailwind Rainbow Editor</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --panel2:#1b1b1b; --line:#2a2a2a;
    --text:#f2f2f2; --sub:#9a9a9a; --accent:#7dd3fc;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .layout{display:flex;flex-wrap:wrap;gap:20px;max-width:1800px;margin:20px auto;padding:0 24px 60px;align-items:flex-start;}
  .palette{flex:0 0 1000px;width:1000px;min-width:0;display:flex;flex-direction:column;gap:6px;}

  .band{display:flex;align-items:center;gap:10px;border-radius:10px;padding:4px;transition:background .15s;}
  .band.locked{opacity:.72;}
  .band.active{background:#ffffff10;box-shadow:0 0 0 1px var(--accent);}
  .band.multiselected{background:#ffffff08;box-shadow:0 0 0 1px #ffffff30;}

  .band-label{width:70px;flex:0 0 70px;font-size:.75rem;color:var(--sub);cursor:pointer;user-select:none;text-align:right;padding-right:4px;}
  .band-label:hover{color:var(--text);}

  .swatches{display:flex;flex:1;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0006;}
  .swatch{flex:1;min-width:48px;height:48px;position:relative;cursor:crosshair;display:flex;align-items:flex-end;}
  .swatch:active{cursor:crosshair;}
  .swatch-lock{position:absolute;inset:0 auto 0 0;width:20px;display:grid;place-items:center;background:#0008;color:#fff;
    border:0;border-right:1px solid #ffffff30;z-index:2;cursor:pointer;font-size:13px;text-shadow:0 1px 2px #000;}
  .swatch-info{position:absolute;inset:auto 3px 3px;padding:3px 4px;border-radius:4px;background:#0007;color:#fff;
    font:600 7px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.02em;text-shadow:0 1px 1px #000;pointer-events:none;white-space:nowrap;}
  .swatch:first-child .swatch-info{left:22px;}
  body.hide-color-info .swatch-info{display:none;}
  body:not(.hide-color-info) .swatch{height:92px;}
  body.compact-palette .palette{gap:2px;}
  body.compact-palette .band{padding:1px 4px;}
  body.compact-palette .swatch{height:24px;}
  body.compact-palette:not(.hide-color-info) .swatch{height:92px;}
  body.compact-palette .swatch-lock{font-size:11px;}

  .shade-row{display:flex;gap:6px;margin-top:2px;}
  .shade-row .band-label{visibility:hidden;}
  .shade-row .swatches{display:flex;flex:1;}
  .shade-row .swatches span{flex:1;text-align:center;font-size:.65rem;color:var(--sub);}

  .panel{width:340px;flex:0 0 340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:20px;}
  .panel.global-panel{width:700px;flex-basis:700px;}
  .panel.color-panel{width:700px;flex-basis:700px;}
  .panel h2{margin:0 0 2px;font-size:1rem;}
  .panel .sub{color:var(--sub);font-size:.75rem;margin-bottom:14px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 10px;font-size:.72rem;cursor:pointer;}
  .btn:hover{background:#242424;}
  .btn:active{transform:translateY(1px);}
  .btn.tiny{padding:2px 7px;font-size:.62rem;line-height:1.2;text-transform:none;letter-spacing:0;}

  .section{margin-top:16px;}
  .section-title{font-size:.68rem;letter-spacing:.08em;color:var(--sub);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}

  input[type=range]{width:100%;accent-color:var(--accent);}
  .hue-track{height:14px;border-radius:7px;margin-bottom:6px;
    background:linear-gradient(90deg,#ff0091 0%,#ff0000 8.33%,#ff4400 16.67%,#ff9400 25%,
      #c8ff00 33.33%,#00ff00 41.67%,#00ffc8 50%,#00bfff 58.33%,#009eff 66.67%,
      #5976ff 75%,#ba4dff 83.33%,#ff1df8 91.67%,#ff0091 100%);}

  svg.curve{width:100%;height:130px;background:var(--panel2);border-radius:8px;border:1px solid var(--line);touch-action:none;}
  svg.curve.small{height:90px;}
  svg.curve circle{cursor:move;}
  svg.curve circle:hover{r:8;}
  svg.curve .curve-guide{stroke:#ffffff16;stroke-width:1;}

  .editor-switch{display:flex;gap:6px;margin-bottom:14px;padding:3px;background:#0d0d0d;border-radius:9px;}
  .editor-switch .btn{flex:1;border-color:transparent;}
  .editor-switch .btn.active{background:#26343b;color:var(--accent);border-color:#3f6373;}

  .checks{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:.75rem;color:var(--sub);}
  .checks label{display:flex;align-items:center;gap:6px;cursor:pointer;}

  .num-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;font-size:.7rem;color:var(--sub);}
  .num-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
  .num-grid b{color:var(--text);display:block;font-size:.85rem;}

  .toggle-link{font-size:.68rem;color:var(--accent);cursor:pointer;}
  .curve-help{font-size:.65rem;color:var(--sub);margin-top:5px;}
  .empty{color:var(--sub);font-size:.8rem;text-align:center;padding:40px 0;}

  .hue-wheel-wrap{position:relative;width:min(100%,290px);aspect-ratio:1;margin:8px auto 0;border-radius:50%;
    background-color:#ff0091;
    background:conic-gradient(from 0deg,
      #ff0091 0deg,#ff0000 30deg,#ff4400 60deg,#ff9400 90deg,
      #c8ff00 120deg,#00ff00 150deg,#00ffc8 180deg,#00bfff 210deg,
      #009eff 240deg,#5976ff 270deg,#ba4dff 300deg,#ff1df8 330deg,#ff0091 360deg);
    box-shadow:0 0 0 1px var(--line),inset 0 0 0 18px #0000;}
  .hue-wheel-wrap::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--panel2);border:1px solid #ffffff28;pointer-events:none;}
  .hue-wheel{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none;z-index:1;}
  .hue-spoke{stroke:#ffffff24;stroke-width:.6;}
  .hue-marker{cursor:grab;filter:drop-shadow(0 1px 2px #000);}
  .hue-marker:active{cursor:grabbing;}
  .hue-marker.locked{cursor:not-allowed;opacity:.55;}
  .hue-label{fill:#fff;font-size:7px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:2px;stroke-linejoin:round;pointer-events:none;}
  .hue-center-label{position:absolute;inset:42%;z-index:2;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:.65rem;line-height:1.2;pointer-events:none;}
  .global-controls-grid{display:grid;grid-template-columns:minmax(260px,290px) minmax(300px,1fr);gap:18px;align-items:start;}
  .global-controls-grid .section{margin-top:0;}
  .global-curve-column{display:flex;flex-direction:column;gap:14px;}
  .color-curves-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .color-curves-grid .section{margin-top:16px;min-width:0;}
  .row-import{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:12px;}
  .row-import textarea{min-height:54px;resize:vertical;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 8px;font:10px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;}
  .row-import .import-status{grid-column:1/-1;color:var(--sub);font-size:.68rem;}
  @media (max-width:1100px){
    .layout{overflow-x:auto;}
    .palette{flex-basis:720px;width:720px;}
    .panel.global-panel{width:440px;flex-basis:440px;}
    .panel.color-panel{width:440px;flex-basis:440px;}
    .global-controls-grid{grid-template-columns:1fr;}
    .color-curves-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body class="hide-color-info compact-palette">

<div class="layout">
  <div class="palette" id="palette"></div>

  <div class="panel" id="panel"></div>
</div>

<script>
const SHADES = [50,100,200,300,400,500,600,700,800,900,950];

const COLOR_DEFS = [
  ["red",25],["orange",50],["amber",70],["yellow",95],["lime",130],
  ["green",145],["emerald",160],["teal",180],["cyan",195],["sky",230],
  ["blue",260],["indigo",275],["violet",290],["purple",300],
  ["fuchsia",320],["pink",350],["rose",10],
  ["slate",264,.12],["gray",264,.08],["zinc",286,.06],["neutral",0,0],
  ["stone",58,.06],["taupe",45,.08],["mauve",325,.10],["mist",220,.08],["olive",110,.12]
];

// Canonical Tailwind CSS OKLCH triples, compressed as L×1000,C×1000,H×1000.
const TW_DATA = {
  red:'971,13,17380;936,32,17717;885,62,18334;808,114,19571;704,191,22216;637,237,25331;577,245,27325;505,213,27518;444,177,26899;396,141,25723;258,92,26042',
  orange:'980,16,73684;954,38,75164;901,76,70697;837,128,66290;750,183,55934;705,213,47604;646,222,41116;553,195,38402;470,157,37304;408,123,38172;266,79,36259',
  amber:'987,22,95277;962,59,95617;924,120,95746;879,169,91605;828,189,84429;769,188,70080;666,179,58318;555,163,48998;473,137,46201;414,112,45904;279,77,45635',
  yellow:'987,26,102212;973,71,103193;945,129,101540;905,182,98111;852,199,91936;795,184,86047;681,162,75834;554,135,66442;476,114,61907;421,95,57708;286,66,53813',
  lime:'986,31,120757;967,67,122328;938,127,124321;897,196,126665;841,238,128850;768,233,130850;648,200,131684;532,157,131589;453,124,130933;405,101,131063;274,72,132109',
  green:'982,18,155826;962,44,156743;925,84,155995;871,150,154449;792,209,151711;723,219,149579;627,194,149214;527,154,150069;448,119,151328;393,95,152535;266,65,152934',
  emerald:'979,21,166113;950,52,163051;905,93,164150;845,143,164978;765,177,163223;696,170,162480;596,145,163225;508,118,165612;432,95,166913;378,77,168940;262,51,172552',
  teal:'984,14,180720;953,51,180801;910,96,180426;855,138,181071;777,152,181912;704,140,182503;600,118,184704;511,96,186391;437,78,188216;386,63,188416;277,46,192524',
  cyan:'984,19,200873;956,45,203388;917,80,205041;865,127,207078;789,154,211530;715,143,215221;609,126,221723;520,105,223128;450,85,224283;398,70,227392;302,56,229695',
  sky:'977,13,236620;951,26,236824;901,58,230902;828,111,230318;746,160,232661;685,169,237323;588,158,241966;500,134,242749;443,110,240790;391,90,240876;293,66,243157',
  blue:'970,14,254604;932,32,255585;882,59,254128;809,105,251813;707,165,254624;623,214,259815;546,245,262881;488,243,264376;424,199,265638;379,146,265522;282,91,267935',
  indigo:'962,18,272314;930,34,272788;870,65,274039;785,115,274713;673,182,276935;585,233,277117;511,262,276966;457,240,277023;398,195,277366;359,144,278697;257,90,281288',
  violet:'969,16,293756;943,29,294588;894,57,293283;811,111,293571;702,183,293541;606,250,292717;541,281,293009;491,270,292581;432,232,292759;380,189,293745;283,141,291089',
  purple:'977,14,308299;946,33,307174;902,63,306703;827,119,306383;714,203,305504;627,265,303900;558,288,302321;496,265,301924;438,218,303724;381,176,304987;291,149,302717',
  fuchsia:'977,17,320058;952,37,318852;903,76,319620;833,145,321434;740,238,322160;667,295,322150;591,293,322896;518,253,323949;452,211,324591;401,170,325612;293,136,325661',
  pink:'971,14,343198;948,28,342258;899,61,343231;823,120,346018;718,202,349761;656,241,354308;592,249,584;525,223,3958;459,187,3815;408,153,2432;284,109,3907',
  rose:'969,15,12422;941,30,12580;892,58,10001;810,117,11638;712,194,13428;645,246,16439;586,253,17585;514,222,16935;455,188,13697;410,159,10272;271,105,12094',
  slate:'984,3,247858;968,7,247896;929,13,255508;869,22,252894;704,40,256788;554,46,257417;446,43,257281;372,44,257287;279,41,260031;208,42,265755;129,42,264695',
  gray:'985,2,247839;967,3,264542;928,6,264531;872,10,258338;707,22,261325;551,27,264364;446,30,256802;373,34,259733;278,33,256848;210,34,264665;130,28,261692',
  zinc:'985,0,0;967,1,286375;920,4,286320;871,6,286286;705,15,286067;552,16,285938;442,17,285786;370,13,285805;274,6,286033;210,6,285885;141,5,285823',
  neutral:'985,0,0;970,0,0;922,0,0;870,0,0;708,0,0;556,0,0;439,0,0;371,0,0;269,0,0;205,0,0;145,0,0',
  stone:'985,1,106423;970,1,106424;923,3,48717;869,5,56366;709,10,56259;553,13,58071;444,11,73639;374,10,67558;268,7,34298;216,6,56043;147,4,49250',
  taupe:'986,2,67800;960,2,17200;922,5,34300;868,7,39500;714,14,41200;547,21,43100;438,17,39300;367,16,35700;268,11,36500;214,9,43100;147,4,49300',
  mauve:'985,0,0;960,3,325600;922,5,325620;865,12,325680;711,19,323020;542,34,322500;435,29,321780;364,29,323890;263,24,320120;212,19,322120;145,8,326000',
  mist:'987,2,197100;963,2,197100;925,5,214300;872,7,219600;723,14,214400;560,21,213500;450,17,213200;378,15,216000;275,11,216900;218,8,223900;148,4,228800',
  olive:'988,3,106500;966,5,106500;930,7,106500;880,11,106600;737,21,106900;580,31,107300;466,25,107300;394,23,107400;286,16,107400;228,13,107400;153,6,107100',
};

function tailwindRamp(name){
  return TW_DATA[name].split(';').map(entry=>{
    const [L,C,H]=entry.split(',').map(Number);
    return [L/1000,C/1000,H/1000];
  });
}

function deriveGlobalDefaults(){
  const definitions=COLOR_DEFS.map(([name,,chromaScale=1])=>({ramp:tailwindRamp(name),chromaScale}));
  const L=SHADES.map((_,i)=>definitions.reduce((sum,item)=>sum+item.ramp[i][0],0)/definitions.length);
  // Least-squares solution for C when a row contributes globalC × chromaScale.
  const C=SHADES.map((_,i)=>{
    const numerator=definitions.reduce((sum,item)=>sum+item.chromaScale*item.ramp[i][1],0);
    const denominator=definitions.reduce((sum,item)=>sum+item.chromaScale*item.chromaScale,0);
    return numerator/denominator;
  });
  return {L,C};
}

const optimizedDefaults=deriveGlobalDefaults();
const L_DEFAULT=optimizedDefaults.L;
const C_DEFAULT=optimizedDefaults.C;

function makeBand(name, hue, chromaScale=1){
  const ramp=tailwindRamp(name);
  const H=ramp.map(point=>point[2]);
  const L=ramp.map((point,i)=>point[0]-L_DEFAULT[i]);
  const C=ramp.map((point,i)=>point[1]-C_DEFAULT[i]*chromaScale);
  hue=H[5];
  return {
    name, hue, chromaScale, H, L, C,
    default: { hue, H:H.slice(), L: L.slice(), C: C.slice() }
  };
}

const bands = COLOR_DEFS.map(def => makeBand(...def));
bands.forEach(b => b.locked = false);

const globalCurves = { L:L_DEFAULT.slice(), C:C_DEFAULT.slice() };

let selected = [];      // indices, in click order
let opts = { smooth:false, lockOrder:true, lockEnds:false };
let editorMode = 'color';
let showColorInfo = false;
let compactPalette = true;
let soloBand = null;
let rowImportText = '';
let rowImportStatus = '';

// ---------- OKLCH -> sRGB ----------
function oklchToSrgb(L, C, Hdeg){
  const h = Hdeg * Math.PI / 180;
  const a = C * Math.cos(h);
  const b = C * Math.sin(h);

  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;

  const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;

  let r = +4.0767416621*l -3.3077115913*m +0.2309699292*s;
  let g = -1.2684380046*l +2.6097574011*m -0.3413193965*s;
  let bl= -0.0041960863*l -0.7034186147*m +1.7076147010*s;

  const toSrgb = c => c<=0.0031308 ? 12.92*c : 1.055*Math.pow(Math.max(c,0),1/2.4)-0.055;
  r = toSrgb(r); g = toSrgb(g); bl = toSrgb(bl);

  const clamp = c => Math.min(1,Math.max(0,c));
  r=clamp(r); g=clamp(g); bl=clamp(bl);

  return { rgb:[Math.round(r*255),Math.round(g*255),Math.round(bl*255)] };
}

function srgbToOklch(rgb){
  const linear=byte=>{ const v=byte/255; return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4); };
  const r=linear(rgb[0]),g=linear(rgb[1]),b=linear(rgb[2]);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b);
  const m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b);
  const s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.793617785*m-.0040720468*s;
  const a=1.9779984951*l-2.428592205*m+.4505937099*s;
  const bb=.0259040371*l+.7827717662*m-.808675766*s;
  return {L,C:Math.hypot(a,bb),H:(Math.atan2(bb,a)*180/Math.PI+360)%360};
}

function parseHexColors(text){
  const tokens=text.match(/#?[0-9a-f]{6}\b|#?[0-9a-f]{3}\b/gi)||[];
  return tokens.map(token=>{
    let hex=token.replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
  });
}

function swatchOklch(band,i){
  const L=Math.min(1,Math.max(0,globalCurves.L[i]+band.L[i]));
  const C=Math.min(.4,Math.max(0,globalCurves.C[i]*band.chromaScale+band.C[i]));
  return {L,C,H:band.H[i]};
}

function swatchColor(band,i){
  const {L,C,H}=swatchOklch(band,i);
  return oklchToSrgb(L,C,H);
}

// ---------- selection helpers ----------
function isSelected(i){ return selected.includes(i); }
function primaryIndex(){ return selected.length ? selected[selected.length-1] : null; }

function selectBand(i, additive){
  if(additive){
    const pos = selected.indexOf(i);
    if(pos>=0) selected.splice(pos,1); else selected.push(i);
  } else {
    selected = [i];
  }
  editorMode = 'color';
  renderAll();
}

// ---------- palette rendering ----------
function renderPalette(){
  const root = document.getElementById('palette');
  root.innerHTML = '';

  bands.forEach((band, bi) => {
    if(soloBand!==null && soloBand!==bi) return;
    const row = document.createElement('div');
    row.className = 'band' + (primaryIndex()===bi ? ' active' : '') + (isSelected(bi) && primaryIndex()!==bi ? ' multiselected' : '') + (band.locked?' locked':'');

    const label = document.createElement('div');
    label.className = 'band-label';
    label.textContent = band.name;
    label.addEventListener('click', e => selectBand(bi, e.shiftKey || e.ctrlKey || e.metaKey));
    row.appendChild(label);

    const swWrap = document.createElement('div');
    swWrap.className = 'swatches';

    SHADES.forEach((shade, si) => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      const {rgb} = swatchColor(band, si);
      sw.style.background = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      sw.title = `${band.name}-${shade} · drag horizontally for OKLCH chroma, vertically for OKLCH lightness`;
      const {L,C,H}=swatchOklch(band,si);
      const hex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
      const info=document.createElement('div'); info.className='swatch-info';
      info.innerHTML=`${band.name}-${shade}<br>L&nbsp; ${(L*100).toFixed(1)}%<br>C&nbsp; ${C.toFixed(3)}<br>H&nbsp; ${H.toFixed(3)}°<br>${hex}`;
      sw.appendChild(info);

      if(si===0){
        const lock = document.createElement('button');
        lock.className='swatch-lock';
        lock.textContent=band.locked?'🔒':'🔓';
        lock.title=band.locked?`Unlock ${band.name}`:`Lock ${band.name}`;
        lock.setAttribute('aria-label',lock.title);
        lock.onclick=e=>{ e.stopPropagation(); band.locked=!band.locked; renderAll(); };
        sw.appendChild(lock);
      }

      sw.addEventListener('pointerdown', ev => { if(!band.locked) startSwatchDrag(ev, bi, si); });
      swWrap.appendChild(sw);
    });

    row.appendChild(swWrap);
    root.appendChild(row);
  });

  // shade number ruler
  const ruler = document.createElement('div');
  ruler.className = 'shade-row';
  const rl = document.createElement('div'); rl.className='band-label'; ruler.appendChild(rl);
  const rw = document.createElement('div'); rw.className='swatches';
  SHADES.forEach(s => { const span=document.createElement('span'); span.textContent=s; rw.appendChild(span); });
  ruler.appendChild(rw);
  root.appendChild(ruler);
}

function startSwatchDrag(ev, bi, si){
  ev.preventDefault();
  if(!isSelected(bi)) selectBand(bi, ev.shiftKey||ev.ctrlKey||ev.metaKey);

  const band = bands[bi];
  const startX = ev.clientX, startY = ev.clientY;
  const startL=band.L[si], startC=band.C[si];

  function move(e){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    band.C[si] = Math.min(0.4, Math.max(-0.4, startC + dx*0.0012));
    band.L[si] = Math.min(1, Math.max(-1, startL - dy*0.002));
    renderAll();
  }
  function up(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  }
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

// ---------- curve editor ----------
function buildCurveSVG(getArr, setArr, opts_){
  const W=300, H=opts_.small?90:130, PAD=8;
  const n = SHADES.length;
  const xAt = x => PAD + x*(W-2*PAD);
  const yAt = v => H - PAD - v*(H-2*PAD); // v in 0..1 normalized

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('class','curve'+(opts_.small?' small':''));

  const valueMin=opts_.min!==undefined?opts_.min:0;
  const valueMax=opts_.max!==undefined?opts_.max:(opts_.norm||1);
  function normalize(v){ return (v-valueMin)/(valueMax-valueMin); }
  function denormalize(v){ return valueMin+v*(valueMax-valueMin); }

  // Ramer–Douglas–Peucker fitting keeps only pivots that materially affect the ramp.
  function fitPivots(values, tolerance=0.018){
    const points=values.map((v,i)=>({x:i/(values.length-1),y:normalize(v)}));
    function simplify(first,last,keep){
      const a=points[first], b=points[last]; let best=-1, index=-1;
      for(let i=first+1;i<last;i++){
        const expected=a.y+(b.y-a.y)*(points[i].x-a.x)/(b.x-a.x);
        const error=Math.abs(points[i].y-expected);
        if(error>best){best=error;index=i;}
      }
      if(best>tolerance){ keep.add(index); simplify(first,index,keep); simplify(index,last,keep); }
    }
    const keep=new Set([0,points.length-1]); simplify(0,points.length-1,keep);
    return [...keep].sort((a,b)=>a-b).map(i=>points[i]);
  }

  let pivots=fitPivots(getArr(),opts_.norm===.4?.025:.018);

  function tangent(i){
    if(i===0) return (pivots[1].y-pivots[0].y)/(pivots[1].x-pivots[0].x);
    if(i===pivots.length-1){ const a=pivots[i-1],b=pivots[i]; return (b.y-a.y)/(b.x-a.x); }
    return (pivots[i+1].y-pivots[i-1].y)/(pivots[i+1].x-pivots[i-1].x);
  }

  function controls(i){
    const a=pivots[i], b=pivots[i+1], dx=(b.x-a.x)/3;
    return [{x:a.x+dx,y:a.y+tangent(i)*dx},{x:b.x-dx,y:b.y-tangent(i+1)*dx}];
  }

  function sampleAt(x){
    let i=Math.min(pivots.length-2,Math.max(0,pivots.findIndex((p,j)=>j<pivots.length-1 && x>=p.x && x<=pivots[j+1].x)));
    const a=pivots[i], b=pivots[i+1], [c1,c2]=controls(i), t=(x-a.x)/(b.x-a.x), u=1-t;
    return Math.min(1,Math.max(0,u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y));
  }

  function sampledValues(){ return Array.from({length:n},(_,i)=>denormalize(sampleAt(i/(n-1)))); }

  function commit(previous){
    const next=sampledValues();
    const globalBefore=opts_.protectLocked?globalCurves[opts_.protectLocked].slice():null;
    const targets=opts_.targets?opts_.targets():selected;
    targets.forEach(target=>{
      const arr=setArr(target); if(!arr) return;
      for(let i=0;i<n;i++) arr[i]=Math.min(valueMax,Math.max(valueMin,arr[i]+next[i]-previous[i]));
      if(opts.lockOrder && opts_.desc){
        for(let i=1;i<n;i++) arr[i]=Math.min(arr[i],arr[i-1]);
      }
    });
    if(globalBefore){
      const key=opts_.protectLocked;
      bands.forEach(b=>{ if(b.locked) for(let i=0;i<n;i++){
        const scale=key==='C'?b.chromaScale:1;
        b[key][i]-=(globalCurves[key][i]-globalBefore[i])*scale;
      }});
    }
    renderPaletteOnly(); updateReadouts();
  }

  function redraw(){
    svg.innerHTML='';
    [0.25,0.5,0.75].forEach(f=>{
      const line=document.createElementNS(svg.namespaceURI,'line');
      line.setAttribute('x1',PAD); line.setAttribute('x2',W-PAD);
      line.setAttribute('y1',yAt(f)); line.setAttribute('y2',yAt(f)); line.setAttribute('class','curve-guide');
      svg.appendChild(line);
    });
    const path = document.createElementNS(svg.namespaceURI,'path');
    let d = `M ${xAt(pivots[0].x)} ${yAt(pivots[0].y)}`;
    for(let i=0;i<pivots.length-1;i++){
      const b=pivots[i+1], [c1,c2]=controls(i);
      d += ` C ${xAt(c1.x)} ${yAt(c1.y)}, ${xAt(c2.x)} ${yAt(c2.y)}, ${xAt(b.x)} ${yAt(b.y)}`;
    }
    path.setAttribute('d',d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','#7dd3fc');
    path.setAttribute('stroke-width','1.5');
    svg.appendChild(path);

    pivots.forEach((point,i)=>{
      const c = document.createElementNS(svg.namespaceURI,'circle');
      c.setAttribute('cx',xAt(point.x)); c.setAttribute('cy',yAt(point.y)); c.setAttribute('r',6);
      c.setAttribute('fill','#7dd3fc'); c.setAttribute('stroke','#0a0a0a'); c.setAttribute('stroke-width','1');
      const locked = opts.lockEnds && (i===0 || i===pivots.length-1);
      c.style.opacity = locked ? '0.4' : '1';
      if(!locked) c.addEventListener('pointerdown', e=>{ if(e.altKey){e.preventDefault();removePoint(i);} else dragPoint(e,i); });
      c.addEventListener('contextmenu',e=>{ e.preventDefault(); removePoint(i); });
      c.setAttribute('aria-label',`Curve pivot ${i+1}`);
      svg.appendChild(c);
    });
  }

  function dragPoint(ev, i){
    ev.preventDefault(); ev.stopPropagation();
    const rect = svg.getBoundingClientRect();

    function move(e){
      const previous=sampledValues();
      const relX=(e.clientX-rect.left)*(W/rect.width);
      const relY = (e.clientY-rect.top) * (H/rect.height);
      pivots[i].y=Math.min(1,Math.max(0,1-(relY-PAD)/(H-2*PAD)));
      if(i>0 && i<pivots.length-1){
        const min=pivots[i-1].x+.015, max=pivots[i+1].x-.015;
        pivots[i].x=Math.min(max,Math.max(min,(relX-PAD)/(W-2*PAD)));
      }
      commit(previous); redraw();
    }
    function up(){
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
    }
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }

  function addPoint(e){
    const rect=svg.getBoundingClientRect();
    const x=Math.min(.999,Math.max(.001,((e.clientX-rect.left)*(W/rect.width)-PAD)/(W-2*PAD)));
    if(pivots.some(p=>Math.abs(p.x-x)<.02)) return;
    const previous=sampledValues();
    const y=Math.min(1,Math.max(0,1-(((e.clientY-rect.top)*(H/rect.height))-PAD)/(H-2*PAD)));
    pivots.push({x,y}); pivots.sort((a,b)=>a.x-b.x); commit(previous); redraw();
  }

  function removePoint(i){
    if(pivots.length<=2 || i===0 || i===pivots.length-1) return;
    const previous=sampledValues(); pivots.splice(i,1); commit(previous); redraw();
  }

  svg.addEventListener('dblclick',addPoint);
  svg.addEventListener('contextmenu',e=>e.preventDefault());

  redraw();
  return svg;
}

// ---------- panel rendering ----------
function renderPanel(){
  const panel = document.getElementById('panel');
  panel.innerHTML='';
  panel.classList.toggle('global-panel',editorMode==='global');
  panel.classList.toggle('color-panel',editorMode==='color' && selected.length>0);

  const switcher=document.createElement('div'); switcher.className='editor-switch';
  switcher.innerHTML=`<button class="btn ${editorMode==='color'?'active':''}">Color</button><button class="btn ${editorMode==='global'?'active':''}">Global</button>`;
  switcher.children[0].onclick=()=>{editorMode='color';renderPanel();};
  switcher.children[1].onclick=()=>{editorMode='global';renderPanel();};
  panel.appendChild(switcher);

  if(editorMode==='global'){ renderGlobalPanel(panel); return; }
  if(selected.length===0){
    const empty=document.createElement('div'); empty.className='empty'; empty.innerHTML='Select a color band<br>to edit its ramp'; panel.appendChild(empty);
    return;
  }

  const pi = primaryIndex();
  const band = bands[pi];
  const multi = selected.length>1;

  const header = document.createElement('div');
  header.className='row-between';
  const h2 = document.createElement('h2');
  h2.textContent = multi ? `${selected.length} bands selected` : band.name;
  const resetBtn = document.createElement('button');
  resetBtn.className='btn'; resetBtn.textContent='Reset';
  resetBtn.onclick = () => {
    selected.forEach(bi=>{
      const b = bands[bi];
      if(b.locked) return;
      b.hue = b.default.hue; b.H=b.default.H.slice(); b.L = b.default.L.slice(); b.C = b.default.C.slice();
    });
    renderAll();
  };
  header.appendChild(h2); header.appendChild(resetBtn);
  panel.appendChild(header);

  const sub = document.createElement('div');
  sub.className='sub';
  sub.textContent = multi ? bands.filter((_,i)=>isSelected(i)).map(b=>b.name).join(', ') : `OKLCH ramp, shades 50 → 950`;
  panel.appendChild(sub);

  const importer=document.createElement('div'); importer.className='row-import';
  const importInput=document.createElement('textarea');
  importInput.placeholder='Paste 11 hex colors in shade order: #fff #f5f5f5 … #111';
  importInput.value=rowImportText;
  const importBtn=document.createElement('button'); importBtn.className='btn'; importBtn.textContent='Import 11 colors';
  const importStatus=document.createElement('div'); importStatus.className='import-status'; importStatus.textContent=rowImportStatus;
  importBtn.onclick=()=>{
    rowImportText=importInput.value;
    const colors=parseHexColors(rowImportText);
    if(colors.length!==SHADES.length){
      rowImportStatus=`Expected 11 hex values; found ${colors.length}.`;
      importStatus.textContent=rowImportStatus; return;
    }
    if(band.locked){ rowImportStatus=`Unlock ${band.name} before importing.`; importStatus.textContent=rowImportStatus; return; }
    const converted=colors.map(srgbToOklch);
    band.H=converted.map(color=>color.H);
    band.L=converted.map((color,i)=>color.L-globalCurves.L[i]);
    band.C=converted.map((color,i)=>color.C-globalCurves.C[i]*band.chromaScale);
    band.hue=band.H[5];
    rowImportStatus=`Imported ${colors.length} colors into ${band.name}, shades 50 → 950.`;
    renderAll();
  };
  importer.appendChild(importInput); importer.appendChild(importBtn); importer.appendChild(importStatus);
  panel.appendChild(importer);

  // HUE
  const hueSection = document.createElement('div'); hueSection.className='section';
  hueSection.innerHTML = `<div class="section-title">OKLCH hue (H) <span id="hueVal"></span></div><div class="hue-track"></div>`;
  const hueSlider = document.createElement('input');
  hueSlider.type='range'; hueSlider.min=0; hueSlider.max=360; hueSlider.step=.001; hueSlider.value=band.hue;
  hueSlider.oninput = () => {
    const val = Number(hueSlider.value);
    const delta = val - band.hue;
    selected.forEach(bi => { if(!bands[bi].locked){
      bands[bi].hue=(bands[bi].hue+delta+360)%360;
      bands[bi].H=bands[bi].H.map(h=>(h+delta+360)%360);
    }});
    document.getElementById('hueVal').textContent = val.toFixed(3)+'°';
    renderPaletteOnly(); updateReadouts();
  };
  hueSection.appendChild(hueSlider);
  panel.appendChild(hueSection);

  const curvesGrid=document.createElement('div'); curvesGrid.className='color-curves-grid';
  panel.appendChild(curvesGrid);

  // Per-color curves are zero-based adjustments over the global ramp.
  const lSection = document.createElement('div'); lSection.className='section';
  const lLimit=Math.max(.25,...band.L.map(Math.abs));
  lSection.innerHTML = `<div class="section-title"><span>OKLCH lightness (L) · ±${lLimit.toFixed(2)}</span><button class="btn tiny" type="button">Reset</button></div>`;
  lSection.querySelector('button').onclick=()=>{
    selected.forEach(bi=>{ if(!bands[bi].locked) bands[bi].L=SHADES.map(()=>0); });
    renderAll();
  };
  lSection.appendChild(buildCurveSVG(
    ()=>band.L,
    bi=>bands[bi].locked?null:bands[bi].L,
    {small:false,min:-lLimit,max:lLimit,desc:false}
  ));
  lSection.insertAdjacentHTML('beforeend','<div class="curve-help">Zero means “use global” · drag pivots · double-click to add · Alt/right-click to remove</div>');
  curvesGrid.appendChild(lSection);

  // OKLCH CHROMA curve
  const cSection = document.createElement('div'); cSection.className='section';
  const cTitle = document.createElement('div'); cTitle.className='section-title';
  const cLimit=Math.max(.15,...band.C.map(Math.abs));
  cTitle.innerHTML = `<span>OKLCH chroma (C) · ±${cLimit.toFixed(2)}</span><button class="btn tiny" type="button">Reset</button>`;
  cTitle.querySelector('button').onclick = () => {
    selected.forEach(bi=>{ if(!bands[bi].locked) bands[bi].C=SHADES.map(()=>0); });
    renderAll();
  };
  cSection.appendChild(cTitle);
  const cSvg = buildCurveSVG(
    ()=>band.C,
    (bi)=>bands[bi].locked?null:bands[bi].C,
    {small:false,min:-cLimit,max:cLimit,desc:false}
  );
  cSection.appendChild(cSvg);
  cSection.insertAdjacentHTML('beforeend','<div class="curve-help">Zero means “use global” · drag pivots · double-click to add · Alt/right-click to remove</div>');
  curvesGrid.appendChild(cSection);

  // checkboxes
  const checks = document.createElement('div'); checks.className='checks';
  checks.innerHTML = `
    <label><input type="checkbox" id="chkLockOrder" ${opts.lockOrder?'checked':''}> Lock ordering</label>
    <label><input type="checkbox" id="chkLockEnds" ${opts.lockEnds?'checked':''}> Lock endpoints</label>
    <label><input type="checkbox" id="chkSolo" ${soloBand===pi?'checked':''}> Solo color</label>
  `;
  panel.appendChild(checks);
  checks.querySelector('#chkLockOrder').onchange = e => { opts.lockOrder = e.target.checked; };
  checks.querySelector('#chkLockEnds').onchange = e => { opts.lockEnds = e.target.checked; renderPanel(); };
  checks.querySelector('#chkSolo').onchange = e => { soloBand=e.target.checked?pi:null; renderAll(); };

  // numeric readouts (for primary swatch = 500 shade as representative)
  const numGrid = document.createElement('div'); numGrid.className='num-grid'; numGrid.id='numGrid';
  panel.appendChild(numGrid);

  document.getElementById('hueVal').textContent = band.hue.toFixed(3)+'°';
  updateReadouts();
}

function buildHueWheel(){
  const wrap=document.createElement('div'); wrap.className='hue-wheel-wrap';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 300 300'); svg.setAttribute('class','hue-wheel');
  const center=document.createElement('div'); center.className='hue-center-label'; center.innerHTML='OKLCH H<br>0–360°';
  wrap.appendChild(svg); wrap.appendChild(center);

  const position=(hue,r)=>{
    const angle=(hue-90)*Math.PI/180;
    return [150+Math.cos(angle)*r,150+Math.sin(angle)*r];
  };

  bands.forEach((band,bi)=>{
    const spoke=document.createElementNS(svg.namespaceURI,'line'); spoke.setAttribute('class','hue-spoke');
    const dot=document.createElementNS(svg.namespaceURI,'circle'); dot.setAttribute('r','9');
    dot.setAttribute('class','hue-marker'+(band.locked?' locked':''));
    dot.setAttribute('stroke','#fff'); dot.setAttribute('stroke-width','1.5');
    const label=document.createElementNS(svg.namespaceURI,'text'); label.setAttribute('class','hue-label');
    function labelText(){ return `${band.locked?'🔒 ':''}${band.name} ${band.hue.toFixed(3)}°`; }
    label.textContent=labelText();
    const title=document.createElementNS(svg.namespaceURI,'title'); dot.appendChild(title);

    function update(){
      const [x1,y1]=position(band.hue,51), [x2,y2]=position(band.hue,116), [lx,ly]=position(band.hue,137);
      spoke.setAttribute('x1',x1); spoke.setAttribute('y1',y1); spoke.setAttribute('x2',x2); spoke.setAttribute('y2',y2);
      dot.setAttribute('cx',x2); dot.setAttribute('cy',y2);
      const {rgb}=oklchToSrgb(.68,.3,band.hue);
      const brightest=Math.max(rgb[0],rgb[1],rgb[2]);
      const brightnessScale=brightest>0?255/brightest:1;
      const brightRgb=[Math.round(rgb[0]*brightnessScale),Math.round(rgb[1]*brightnessScale),Math.round(rgb[2]*brightnessScale)];
      dot.setAttribute('fill',`rgb(${brightRgb.join(',')})`);
      label.setAttribute('x',lx); label.setAttribute('y',ly+2.5);
      label.textContent=labelText();
      title.textContent=`${band.name}: ${band.hue.toFixed(3)}°${band.locked?' (locked)':''}`;
    }

    if(!band.locked) dot.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      const rect=svg.getBoundingClientRect();
      function move(e){
        const x=(e.clientX-rect.left)*300/rect.width-150;
        const y=(e.clientY-rect.top)*300/rect.height-150;
        const nextHue=(Math.atan2(y,x)*180/Math.PI+90+360)%360;
        const delta=((nextHue-band.hue+540)%360)-180;
        band.hue=nextHue;
        band.H=band.H.map(h=>(h+delta+360)%360);
        update(); renderPaletteOnly();
      }
      function up(){ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); }
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
    });
    dot.addEventListener('click',()=>{ if(!band.locked) selected=[bi]; });
    update(); svg.appendChild(spoke); svg.appendChild(dot); svg.appendChild(label);
  });
  return wrap;
}

function renderGlobalPanel(panel){
  const header=document.createElement('div'); header.className='row-between';
  header.innerHTML='<h2>Global rainbow</h2>';
  const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:5px;align-items:center';
  const compactBtn=document.createElement('button'); compactBtn.className='btn tiny';
  compactBtn.textContent=compactPalette?'Compact: on':'Compact: off';
  compactBtn.setAttribute('aria-pressed',String(compactPalette));
  compactBtn.onclick=()=>{
    compactPalette=!compactPalette;
    document.body.classList.toggle('compact-palette',compactPalette);
    compactBtn.textContent=compactPalette?'Compact: on':'Compact: off';
    compactBtn.setAttribute('aria-pressed',String(compactPalette));
  };
  const infoBtn=document.createElement('button'); infoBtn.className='btn tiny';
  infoBtn.textContent=showColorInfo?'Hide info':'Show info';
  infoBtn.setAttribute('aria-pressed',String(showColorInfo));
  infoBtn.onclick=()=>{
    showColorInfo=!showColorInfo;
    document.body.classList.toggle('hide-color-info',!showColorInfo);
    infoBtn.textContent=showColorInfo?'Hide info':'Show info';
    infoBtn.setAttribute('aria-pressed',String(showColorInfo));
  };
  const reset=document.createElement('button'); reset.className='btn'; reset.textContent='Reset global';
  reset.onclick=()=>{
    const beforeL=globalCurves.L.slice(), beforeC=globalCurves.C.slice();
    globalCurves.L=L_DEFAULT.slice(); globalCurves.C=C_DEFAULT.slice();
    bands.forEach(b=>{ if(b.locked) for(let i=0;i<SHADES.length;i++){
      b.L[i]-=globalCurves.L[i]-beforeL[i];
      b.C[i]-=(globalCurves.C[i]-beforeC[i])*b.chromaScale;
    }});
    renderAll();
  };
  actions.appendChild(compactBtn); actions.appendChild(infoBtn); actions.appendChild(reset);
  header.appendChild(actions); panel.appendChild(header);
  const sub=document.createElement('div'); sub.className='sub';
  sub.textContent=`Shapes all ${bands.filter(b=>!b.locked).length} unlocked colors. Locked colors are protected.`;
  panel.appendChild(sub);

  const controlsGrid=document.createElement('div'); controlsGrid.className='global-controls-grid';
  const curveColumn=document.createElement('div'); curveColumn.className='global-curve-column';
  const hueSection=document.createElement('div'); hueSection.className='section';
  hueSection.innerHTML='<div class="section-title">OKLCH hue (H) <span>360°</span></div>';
  hueSection.appendChild(buildHueWheel());
  hueSection.insertAdjacentHTML('beforeend','<div class="curve-help">Drag a labeled marker around the wheel to adjust its hue. Locked colors stay fixed.</div>');
  controlsGrid.appendChild(hueSection); controlsGrid.appendChild(curveColumn); panel.appendChild(controlsGrid);

  const addCurve=(title,key,norm,desc)=>{
    const section=document.createElement('div'); section.className='section';
    section.innerHTML=`<div class="section-title">${title}<span>Bézier</span></div>`;
    section.appendChild(buildCurveSVG(
      ()=>globalCurves[key],
      target=>target==='global'?globalCurves[key]:null,
      {small:false,norm,desc,targets:()=>['global'],protectLocked:key}
    ));
    section.insertAdjacentHTML('beforeend','<div class="curve-help">Drag pivots · double-click to add · Alt/right-click a pivot to remove</div>');
    curveColumn.appendChild(section);
  };
  addCurve('OKLCH lightness (L)','L',1,true);
  addCurve('OKLCH chroma (C)','C',.4,false);

  const note=document.createElement('div'); note.className='sub'; note.style.marginTop='14px';
  note.textContent='Drag a knot to reshape the smooth cubic Bézier curve. Changes are applied as deltas, preserving each color’s individual character.';
  panel.appendChild(note);
}

function updateReadouts(){
  const grid = document.getElementById('numGrid');
  if(!grid) return;
  const pi = primaryIndex();
  const band = bands[pi];
  const mid = 5; // shade 500 index
  const {rgb} = swatchColor(band, mid);
  const {L:actualL,C:actualC,H:actualH}=swatchOklch(band,mid);
  const hex = '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
  grid.innerHTML = `
    <div>H (500)<b>${actualH.toFixed(3)}°</b></div>
    <div>L (500)<b>${actualL.toFixed(2)}</b></div>
    <div>C (500)<b>${actualC.toFixed(3)}</b></div>
    <div>Hex<b>${hex}</b></div>
  `;
  const hueVal = document.getElementById('hueVal');
  if(hueVal) hueVal.textContent = band.hue.toFixed(3)+'°';
  const hueSlider = document.querySelector('.section input[type=range]');
  if(hueSlider) hueSlider.value = band.hue;
}

function renderPaletteOnly(){ renderPalette(); }
function renderAll(skipPanel){
  renderPalette();
  if(!skipPanel) renderPanel(); else updateReadouts();
}

renderAll();
</script>
</body>
</html>
